spring.application.name=student-resume-portal
server.port=8080

# Thymeleaf — disable cache during development
spring.thymeleaf.cache=false

# File upload limits (PDF/DOCX CVs)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ollama local LLM
ollama.base-url=http://localhost:11434
ollama.model=qwen2.5:7b-instruct

# SQLite persistence (accounts, saved resumes). busy_timeout=5000: background CV-parsing writes
# can now land at the same moment as a foreground request's write (previously all writes were
# effectively serial on one request thread) — without this, SQLite throws SQLITE_BUSY immediately
# on contention instead of waiting a bit.
spring.datasource.url=jdbc:sqlite:./resumes.db?foreign_keys=on&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CSRF mitigation without full Spring Security: explicit SameSite=Lax on the session cookie
server.servlet.session.cookie.same-site=lax
