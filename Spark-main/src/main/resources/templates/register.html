<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Spark — Sign up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"/>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Bricolage Grotesque"', 'sans-serif'],
                        body: ['Figtree', 'sans-serif'],
                    },
                    colors: {
                        paper: '#FFFDF7', ink: '#16171B', coral: '#FF5D5D', coralDeep: '#E23F3F',
                        cobalt: '#2F5BFF', cobaltDeep: '#1E3FCC', sun: '#FFC93C', mint: '#38C6A6', line: '#EDEAE0',
                    },
                },
            },
        };
    </script>

    <style>
        :root{ --paper:#FFFDF7; --ink:#16171B; --coral:#FF5D5D; --cobalt:#2F5BFF; --sun:#FFC93C; --mint:#38C6A6; --line:#EDEAE0; }
        body{
            background-color:var(--paper);
            background-image:radial-gradient(circle, rgba(22,23,27,.07) 1.3px, transparent 1.3px);
            background-size:24px 24px;
        }
        a:focus-visible, button:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}

        .btn-primary{
            display:inline-flex; align-items:center; justify-content:center; gap:.6rem; background:var(--ink); color:var(--paper);
            font-family:'Figtree',sans-serif; font-weight:700; font-size:1rem;
            padding:.95rem 2rem; border-radius:999px; border:2px solid var(--ink);
            transition:transform .18s ease, background .18s ease, color .18s ease;
        }
        .btn-primary:hover{ background:var(--coral); border-color:var(--coral); }
        .btn-primary:active{ transform:scale(.97); }

        .auth-card {
            position:relative; overflow:hidden;
            background: var(--paper);
            border: 2.5px solid var(--ink);
            border-radius: 1.5rem;
            padding: 3rem 2.5rem;
            box-shadow: 6px 6px 0 var(--ink);
            --spot-x:50%; --spot-y:50%;
        }
        .auth-card::before{
            content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
            background:radial-gradient(circle at var(--spot-x) var(--spot-y), rgba(56,198,166,.16), transparent 65%);
            opacity:0; transition:opacity .4s ease;
        }
        .auth-card:hover::before{ opacity:1; }

        .form-input {
            display: block; width: 100%; padding: 0.8rem 1rem; font-size: 0.95rem;
            background: var(--paper); border: 2px solid var(--line); border-radius: 0.75rem;
            outline: none; transition: all 0.2s ease; font-family: 'Figtree', sans-serif;
        }
        .form-input:focus { border-color: var(--cobalt); box-shadow: 0 0 0 3px rgba(47, 91, 255, 0.1); }

        .sticker{
            position:absolute; background:var(--paper); border:2.5px solid var(--ink); border-radius:1rem;
            padding:.5rem .8rem; font-family:'Figtree',sans-serif; font-weight:700; font-size:.78rem;
            box-shadow:4px 4px 0 var(--ink); transition:transform .25s ease;
        }
        .sticker:hover{ transform:rotate(0deg) scale(1.05) !important; }
    </style>
</head>
<body class="font-body text-ink antialiased min-h-screen">

<nav class="border-b-2 border-ink bg-paper/90 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-6 md:px-10 py-4 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="#FF5D5D" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 1l2.4 7.4L22 11l-7.6 2.6L12 21l-2.4-7.4L2 11l7.6-2.6L12 1z"/>
            </svg>
            <span class="font-display font-extrabold text-2xl">Spark</span>
        </a>
    </div>
</nav>

<main class="max-w-md mx-auto px-6 py-20 relative">
    <div class="sticker hidden sm:block" style="top:-.5rem; right:-1.5rem; transform:rotate(-7deg); background:var(--mint);">✨ it's free</div>

    <div class="auth-card">
        <h1 class="font-display font-extrabold text-2xl mb-1">Create your account</h1>
        <p class="text-ink/70 text-sm font-medium mb-6">Save resumes and come back to edit them anytime.</p>

        <div th:if="${error}" class="mb-5 p-3 border-2 border-ink rounded-xl font-medium text-sm"
             style="background:var(--coral); color:var(--paper);" th:text="${error}"></div>

        <form action="/register" method="post" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-ink/70 uppercase tracking-wider mb-1 block">Username</label>
                <input type="text" name="username" required autofocus class="form-input"/>
            </div>
            <div>
                <label class="text-xs font-bold text-ink/70 uppercase tracking-wider mb-1 block">Password</label>
                <input type="password" name="password" required minlength="8" class="form-input"/>
                <p class="text-xs text-ink/50 font-medium mt-1">At least 8 characters.</p>
            </div>
            <button type="submit" class="btn-primary w-full justify-center mt-2">Create account →</button>
        </form>

        <p class="text-sm text-ink/70 font-medium mt-6 text-center">
            Already have an account? <a href="/login" class="text-cobalt font-bold hover:underline">Log in</a>
        </p>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const card = document.querySelector('.auth-card');
        if (!card) return;
        card.addEventListener('mousemove', (e) => {
            const r = card.getBoundingClientRect();
            card.style.setProperty('--spot-x', `${e.clientX - r.left}px`);
            card.style.setProperty('--spot-y', `${e.clientY - r.top}px`);
        });
    });
</script>
</body>
</html>
