<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Projects list fragment: "fragments/projects :: projectList" -->
<div th:fragment="projectList" id="project-list" class="space-y-4">
    <div th:if="${resume.projects.isEmpty()}" class="text-center py-8 px-2">
        <div class="w-11 h-11 rounded-full flex items-center justify-center mx-auto mb-3 border-2 border-ink" style="background:var(--cobalt);">
            <svg class="w-5 h-5" fill="none" stroke="var(--paper)" viewBox="0 0 24 24" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>
            </svg>
        </div>
        <p class="text-sm font-bold text-ink mb-1">No projects added yet</p>
        <p class="text-xs text-ink/60 font-medium">Show off something you've built.</p>
    </div>
    <div th:each="proj, idx : ${resume.projects}"
         class="border-2 border-ink rounded-xl p-4 space-y-3" style="background:var(--paper); box-shadow:4px 4px 0 var(--ink);">
        <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-ink/70 uppercase tracking-wider">Project #<span th:text="${idx.index + 1}">1</span></span>
            <button type="button"
                    th:attr="hx-delete=${'/builder/projects/' + proj.id}"
                    hx-target="#project-list"
                    hx-swap="outerHTML"
                    class="text-coral hover:text-coralDeep text-xs font-bold transition-colors flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                Remove
            </button>
        </div>
        <form th:attr="hx-post=${'/builder/projects/' + proj.id}"
              hx-target="#preview-container"
              hx-swap="innerHTML"
              hx-trigger="keyup delay:300ms"
              class="space-y-3">
            <input name="title" th:value="${proj.title}" placeholder="Project title"
                   class="form-input w-full"/>
            <input name="techStack" th:value="${proj.techStack}" placeholder="Tech stack (e.g. React, Spring Boot, PostgreSQL)"
                   class="form-input w-full"/>
            <div class="relative">
                <textarea name="summary" th:text="${proj.summary}" rows="3"
                          placeholder="What did you build? What was the impact? (use bullet points: • …)"
                          class="form-input w-full resize-none"></textarea>
                <button type="button"
                        class="ai-suggest-btn absolute bottom-2 right-2"
                        data-field-name="summary"
                        th:data-field-index="${idx.index}"
                        data-section="projects"
                        title="Improve with AI">✦ AI</button>
            </div>
        </form>
    </div>

    <button type="button"
            hx-post="/builder/projects/add"
            hx-target="#project-list"
            hx-swap="outerHTML"
            class="w-full py-3 border-2 border-dashed border-ink rounded-xl text-ink/70 hover:border-coral hover:text-coral hover:bg-coral/10 text-sm font-bold transition-all flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Add project
    </button>
</div>

<!-- Add/delete responses swap the list AND refresh the preview + ATS score out of band -->
<th:block th:fragment="projectListWithPreview">
    <div th:replace="~{::projectList}"></div>
    <div hx-swap-oob="innerHTML:#preview-container">
        <div th:replace="~{fragments/preview :: previewAndBadge}"></div>
    </div>
</th:block>

</body>
</html>
