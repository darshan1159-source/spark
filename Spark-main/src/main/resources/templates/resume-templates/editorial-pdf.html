<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Resume</title>
    <style>
        .ed-wrap { font-family: 'Arial','Helvetica',sans-serif; font-size:10.5pt; color:#1e1e2e; background: #ffffff; }
        .ed-header { background:#2F5BFF; color:#fff; padding:2rem 2.5rem 1.5rem; }
        .ed-name { font-size:26pt; font-weight:800; letter-spacing:-1px; margin-bottom:.3rem; }
        .ed-contact { font-size:8.5pt; color:#c7d2fe; display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; }
        .ed-contact a { color:#c7d2fe; text-decoration:none; }
        /* PDF renderer (openhtmltopdf) doesn't support CSS grid — table-cell is the
           reliably-supported way to get two true side-by-side columns here. */
        .ed-body { display:table; width:100%; table-layout:fixed; }
        .ed-col { display:table-cell; width:50%; padding:1.6rem 1.8rem; vertical-align:top; }
        .ed-col-left { border-right:2px solid #e5e7eb; }
        .ed-section-header {
            font-size:7.5pt; font-weight:800; text-transform:uppercase;
            letter-spacing:2px; color:#2F5BFF;
            border-bottom:2px solid #eef2ff; padding-bottom:.3rem; margin:1.2rem 0 .7rem;
        }
        .ed-section-header:first-child { margin-top:0; }
        .ed-entry-title { font-weight:700; font-size:10.5pt; }
        .ed-entry-sub { font-size:8.5pt; color:#6b7280; margin-bottom:.25rem; }
        .ed-entry-desc { font-size:9.5pt; white-space:pre-line; }
        .ed-skill-chip {
            display:inline-block; background:#eef2ff; color:#2F5BFF;
            border-radius:999px; padding:2px 10px; font-size:8.5pt;
            font-weight:600; margin:.2rem .15rem;
        }
        .ed-empty { color:#aaa; font-size:9pt; font-style:italic; }
        .ed-tag {
            display:inline-block; background:#fff7e6; color:#b45309;
            border-radius:4px; padding:1px 7px; font-size:7pt; font-weight:800;
            text-transform:uppercase; letter-spacing:.5px; margin-left:.4rem; vertical-align:middle;
        }
    </style>
</head>
<body>
<div class="ed-wrap">
<!-- Header -->
<div class="ed-header">
    <div class="ed-name" th:text="${resume.fullName ?: 'Your Name'}">Your Name</div>
    <div class="ed-contact">
        <span th:if="${resume.email}" th:text="${resume.email}"></span>
        <span th:if="${resume.phone}" th:text="${resume.phone}"></span>
        <a th:if="${resume.linkedinUrl}" th:href="${resume.linkedinUrl}">LinkedIn</a>
        <a th:if="${resume.githubUrl}"   th:href="${resume.githubUrl}">GitHub</a>
    </div>
</div>

<!-- Two-column body -->
<div class="ed-body">
    <!-- Left column: Education + Skills -->
    <div class="ed-col ed-col-left">

        <div class="ed-section-header">Education</div>
        <div th:if="${resume.education.isEmpty()}" class="ed-empty">No education entries yet.</div>
        <div th:each="edu : ${resume.education}" style="margin-bottom:.9rem">
            <div class="ed-entry-title" th:text="${edu.institution}">Institution</div>
            <div class="ed-entry-sub" th:text="${edu.degree + (edu.dates != null && !edu.dates.isBlank() ? '  ·  ' + edu.dates : '')}">Degree</div>
            <div class="ed-entry-desc" th:if="${!edu.description.isBlank()}" th:text="${edu.description}"></div>
        </div>

        <div class="ed-section-header">Skills</div>
        <div th:if="${resume.skills.isEmpty()}" class="ed-empty">No skills added yet.</div>
        <div>
            <span th:each="skill : ${resume.skills}" class="ed-skill-chip" th:text="${skill}">skill</span>
        </div>
    </div>

    <!-- Right column: Experience + Projects -->
    <div class="ed-col">

        <div th:if="${!resume.experience.isEmpty()}">
            <div class="ed-section-header">Experience</div>
            <div th:each="exp : ${resume.experience}" style="margin-bottom:.9rem">
                <div class="ed-entry-title">
                    <span th:text="${exp.title}">Title</span>
                    <span th:if="${exp.type != null and !exp.type.isBlank()}" class="ed-tag" th:text="${exp.type}"></span>
                </div>
                <div class="ed-entry-sub" th:text="${exp.company + (exp.dates != null && !exp.dates.isBlank() ? '  ·  ' + exp.dates : '')}">Company</div>
                <div class="ed-entry-desc" th:if="${!exp.description.isBlank()}" th:text="${exp.description}"></div>
            </div>
        </div>

        <div th:if="${!resume.projects.isEmpty()}">
            <div class="ed-section-header">Projects</div>
            <div th:each="proj : ${resume.projects}" style="margin-bottom:.9rem">
                <div class="ed-entry-title" th:text="${proj.title}">Project</div>
                <div class="ed-entry-sub" th:if="${!proj.techStack.isBlank()}" th:text="${proj.techStack}"></div>
                <div class="ed-entry-desc" th:if="${!proj.summary.isBlank()}" th:text="${proj.summary}"></div>
            </div>
        </div>

        <div th:if="${resume.experience.isEmpty() && resume.projects.isEmpty()}" class="ed-empty">
            Add experience or projects to see them here.
        </div>
    </div>
</div>

</div>
</body>
</html>
