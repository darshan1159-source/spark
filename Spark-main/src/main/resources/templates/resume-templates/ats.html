<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  ATS Layout — single column, no colours, machine-readable.
  Used for browser preview (fragment).
  Fragment: "resume-templates/ats :: body"
-->
<body>
<div th:fragment="body" class="ats-body">
<style>
  .ats-body {
    font-family: 'Arial', 'Helvetica', sans-serif;
    font-size: 11pt;
    color: #1a1a1a;
    padding: 1.8rem 2rem;
    max-width: 760px;
    margin: 0 auto;
    background: #ffffff;
  }
  .ats-name { font-size: 22pt; font-weight: 700; letter-spacing: -0.5px; margin-bottom: .2rem; }
  .ats-contact { font-size: 9pt; color: #444; margin-bottom: 1.2rem; }
  .ats-contact a { color: #444; text-decoration: none; }
  .ats-section-header {
    font-size: 10pt; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; border-bottom: 2px solid #1a1a1a;
    padding-bottom: .2rem; margin: 1.2rem 0 .6rem;
  }
  .ats-entry-title { font-weight: 700; font-size: 11pt; }
  .ats-entry-sub { font-size: 9.5pt; color: #555; margin-bottom: .25rem; }
  .ats-entry-desc { font-size: 10pt; white-space: pre-line; margin-left: .25rem; }
  .ats-skills { display: flex; flex-wrap: wrap; gap: .3rem; }
  .ats-skill { font-size: 9.5pt; background: #f0f0f0; border-radius: 3px; padding: 1px 8px; }
  .ats-empty { color: #aaa; font-size: 9.5pt; font-style: italic; }
</style>

<!-- Name + contact -->
<div class="ats-name jump-target" th:text="${resume.fullName ?: 'Your Name'}"
     data-section="personal" data-field-name="fullName" title="Double-click to edit">Your Name</div>
<div class="ats-contact">
    <span th:if="${resume.email}" class="jump-target" th:text="${resume.email}"
          data-section="personal" data-field-name="email" title="Double-click to edit"></span>
    <span th:if="${!#strings.isEmpty(resume.email) and !#strings.isEmpty(resume.phone)}"> · </span>
    <span th:if="${resume.phone}" class="jump-target" th:text="${resume.phone}"
          data-section="personal" data-field-name="phone" title="Double-click to edit"></span>
    <span th:if="${resume.linkedinUrl}"> · <a class="jump-target" th:href="${resume.linkedinUrl}" th:text="${resume.linkedinUrl}"
          data-section="personal" data-field-name="linkedinUrl" title="Double-click to edit"></a></span>
    <span th:if="${resume.githubUrl}"> · <a class="jump-target" th:href="${resume.githubUrl}" th:text="${resume.githubUrl}"
          data-section="personal" data-field-name="githubUrl" title="Double-click to edit"></a></span>
</div>

<!-- Education -->
<div class="ats-section-header">Education</div>
<div th:if="${resume.education.isEmpty()}" class="ats-empty">No education entries yet.</div>
<div th:each="edu, idx : ${resume.education}" style="margin-bottom:.8rem">
    <div class="ats-entry-title jump-target" th:text="${edu.institution}"
         data-section="education" th:data-field-index="${idx.index}" data-field-name="institution" title="Double-click to edit">Institution</div>
    <div class="ats-entry-sub jump-target" th:text="${edu.degree + (edu.dates != null && !edu.dates.isBlank() ? ' · ' + edu.dates : '')}"
         data-section="education" th:data-field-index="${idx.index}" data-field-name="degree" title="Double-click to edit">Degree · Dates</div>
    <div class="ats-entry-desc jump-target" th:if="${!edu.description.isBlank()}" th:text="${edu.description}"
         data-section="education" th:data-field-index="${idx.index}" data-field-name="description" title="Double-click to edit"></div>
</div>

<!-- Experience -->
<div th:if="${!resume.experience.isEmpty()}">
    <div class="ats-section-header">Experience</div>
    <div th:each="exp, idx : ${resume.experience}" style="margin-bottom:.8rem">
        <div class="ats-entry-title jump-target" th:text="${exp.title + (exp.type != null and !exp.type.isBlank() ? ' — ' + exp.type : '')}"
             data-section="experience" th:data-field-index="${idx.index}" data-field-name="title" title="Double-click to edit">Title</div>
        <div class="ats-entry-sub jump-target" th:text="${exp.company + (exp.dates != null && !exp.dates.isBlank() ? ' · ' + exp.dates : '')}"
             data-section="experience" th:data-field-index="${idx.index}" data-field-name="company" title="Double-click to edit">Company · Dates</div>
        <div class="ats-entry-desc jump-target" th:if="${!exp.description.isBlank()}" th:text="${exp.description}"
             data-section="experience" th:data-field-index="${idx.index}" data-field-name="description" title="Double-click to edit"></div>
    </div>
</div>

<!-- Projects -->
<div th:if="${!resume.projects.isEmpty()}">
    <div class="ats-section-header">Projects</div>
    <div th:each="proj, idx : ${resume.projects}" style="margin-bottom:.8rem">
        <div class="ats-entry-title jump-target" th:text="${proj.title}"
             data-section="projects" th:data-field-index="${idx.index}" data-field-name="title" title="Double-click to edit">Project</div>
        <div class="ats-entry-sub jump-target" th:if="${!proj.techStack.isBlank()}" th:text="${proj.techStack}"
             data-section="projects" th:data-field-index="${idx.index}" data-field-name="techStack" title="Double-click to edit"></div>
        <div class="ats-entry-desc jump-target" th:if="${!proj.summary.isBlank()}" th:text="${proj.summary}"
             data-section="projects" th:data-field-index="${idx.index}" data-field-name="summary" title="Double-click to edit"></div>
    </div>
</div>

<!-- Skills -->
<div class="ats-section-header">Skills</div>
<div th:if="${resume.skills.isEmpty()}" class="ats-empty">No skills added yet.</div>
<div class="ats-skills">
    <span th:each="skill : ${resume.skills}" class="ats-skill jump-target" th:text="${skill}"
          data-section="skills" data-field-name="skillsInput" title="Double-click to edit">skill</span>
</div>

</div>
</body>
</html>
